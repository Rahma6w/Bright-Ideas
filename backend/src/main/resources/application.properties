spring.application.name=bright-ideas-api
server.port=8080
spring.datasource.url=jdbc:h2:mem:brightideas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.jwt.secret=BrightIdeasLocalDevelopmentSecretKeyChangeBeforeProduction123456
app.upload-dir=./uploads
app.dev-token-enabled=true
